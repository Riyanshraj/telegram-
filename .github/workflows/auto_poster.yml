name: Telegram Fast Auto Poster

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch: 

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Code Check out karein
        uses: actions/checkout@v3

      - name: Python Setup Karein
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Libraries Install Karein
        run: |
          pip install -r requirements.txt

      - name: Script Run Karein
        run: |
          python main.py
